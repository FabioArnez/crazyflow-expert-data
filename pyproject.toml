[project]
name = "crazyflow-expert-data"
version = "0.1.0"
description = "Velocity-setpoint PPO expert and demonstration pipeline for Crazyflie gate flight in crazyflow (UAVLA data-collection expert)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crazyflow[gpu]==0.4.0",
    "flax>=0.10",
    "optax>=0.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]

[project.scripts]
expert-train = "expert_data.train:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "expert_data"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
