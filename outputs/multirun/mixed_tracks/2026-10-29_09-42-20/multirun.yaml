hydra:
  run:
    dir: outputs/${run.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/multirun/${run.name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: seed_${run.seed}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - experiment=mixed_tracks
    - run.seed=1,2,3,4
  job:
    name: train
    chdir: false
    override_dirname: experiment=mixed_tracks,run.seed=1,2,3,4
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.8
    version_base: '1.3'
    cwd: .
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      experiment: mixed_tracks
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
env:
  drone: cf2x_L250
  sim_freq: 480
  state_freq: 120
  decision_freq: 30
  n_envs: 1024
  v_max_x: 1.5
  v_max_y: 1.0
  v_max_z: 0.75
  yaw_rate_max: 1.5
  cmd_anchor: integrated
  cmd_acc_max_xy: 2.0
  cmd_acc_max_z: 1.0
  cmd_leash: 0.3
  cmd_yaw_leash: 0.3
  n_gates: 5
  n_gates_min: 3
  spacing_min: 1.2
  spacing_max: 2.2
  yaw_range: 0.6
  gate_yaw_noise: 0.3
  dz_max: 0.3
  z_min: 0.7
  z_max: 2.2
  start_z_min: 0.8
  start_z_max: 1.4
  track_type: mixed
  circle_prob: 0.5
  circle_gates_per_turn_min: 5.0
  circle_gates_per_turn_max: 12.0
  circle_radius_noise: 0.1
  circle_angle_noise: 0.1
  circle_yaw_noise: 0.1
  start_xy_jitter: 0.2
  start_yaw_noise: 0.3
  start_vel_max: 0.3
  start_tilt_max: 0.1
  start_ang_vel_max: 0.2
  half_opening: 0.245
  frame_thickness: 0.06
  drone_radius: 0.07
  z_floor: 0.05
  z_ceiling: 3.5
  max_gate_dist: 6.0
  max_tilt: 1.2
  target_speed_min: 0.4
  target_speed_max: 1.2
  time_base: 2.0
  time_slack: 1.5
  obs_remaining_cap: 5
  k_progress: 1.0
  gate_bonus: 5.0
  crash_penalty: 10.0
  miss_penalty: 10.0
  k_ang_vel: 0.002
  k_action_rate: 0.1
  k_yaw: 0.01
  k_speed: 0.5
  k_cmd_gap: 1.0
  dr_mass: 0.1
  dr_inertia: 0.1
  dr_motor_gain: 0.05
net:
  hidden:
  - 256
  - 256
  log_std_init: -0.5
  squash: true
ppo:
  n_steps: 32
  n_epochs: 4
  n_minibatches: 8
  lr: 0.0003
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  clip_vloss: true
  vf_coef: 0.5
  ent_coef: 0.001
  max_grad_norm: 0.5
  normalize_obs: true
  normalize_adv: true
  total_env_steps: 50000000
curriculum:
  enabled: true
  yaw_range_init: 0.2
  yaw_range_step: 0.1
  success_threshold: 0.8
  window: 10
run:
  name: mixed_tracks
  seed: 0
  device: gpu
  log_interval: 10
  ckpt_interval: 100
  init_from: null
  wandb: false
  wandb_project: uavla-expert-data
  jax_cache: true
